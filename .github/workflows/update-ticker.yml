name: Update economic ticker
 
on:
  schedule:
    - cron: "0 12 * * *"   # daily, 12:00 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest numbers
        env:
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY_GDP }}
        run: python3 scripts/update_ticker.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ticker.json
          git diff --cached --quiet || (git commit -m "Update economic ticker data" && git push)
 
